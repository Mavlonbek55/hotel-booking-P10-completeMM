# PostgreSQL is the source of truth; Redis stores disposable search answers.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - hotel-data:/var/lib/postgresql
  cache:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  hotel-data:
